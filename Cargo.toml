[workspace]
members = [
    "agentcanpay",
    "crates/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These two target published-library ergonomics. Across internal crates they
# only add boilerplate, so they are off while the rest of pedantic stays on.
missing_errors_doc = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
acp-connect = { path = "crates/connect" }
acp-keystore = { path = "crates/keystore" }
acp-wallet = { path = "crates/wallet" }

alloy = { version = "2.0.5", default-features = false, features = [
    "std",
    "signer-mnemonic",
    "sol-types",
] }
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.12.4"
keyring = "4.1.6"
open = "5.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
zeroize = { version = "1.9.0", features = ["derive"] }
