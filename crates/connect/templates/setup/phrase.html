<div class="card warn">
  <strong>Write these words down, in order, on paper.</strong>
  <p class="hint">They are the only way to recover this wallet. Anyone who has
  them can spend from it. Do not screenshot them, and do not paste them into a
  chat with the AI agent.</p>
</div>

<ol class="words">
{% for word in words %}
  <li>{{ word }}</li>
{% endfor %}
</ol>

<button class="primary" hx-get="/verify"><span>I have written them down</span></button>
<button hx-post="/cancel">Cancel</button>
