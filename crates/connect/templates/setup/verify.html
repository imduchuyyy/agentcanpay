<p>Confirm you saved the phrase by typing these words.</p>

{% if let Some(message) = error %}
<div class="card err">{{ message }}</div>
{% endif %}

<form hx-post="/confirm">
  {% for position in positions %}
  <label for="w{{ position }}">Word #{{ position + 1 }}</label>
  <input id="w{{ position }}" name="w{{ position }}" autocomplete="off"
         autocapitalize="off" spellcheck="false" />
  {% endfor %}
  <button class="primary" type="submit"><span>Confirm</span></button>
</form>

<button hx-get="/phrase">Show the phrase again</button>
