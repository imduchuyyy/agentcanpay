<script>
  htmx.config.responseHandling = [
    { code: "204", swap: false },
    { code: "[23]..", swap: true },
    { code: "4..", swap: true },
    { code: "5..", swap: false, error: true },
  ];

  // Delegated so it survives htmx swapping the pane out from under it.
  // The words are read back out of the rendered list rather than kept in a
  // data attribute, so the phrase exists in the DOM exactly once.
  document.getElementById("app").addEventListener("click", async (event) => {
    if (!event.target.closest("[data-copy]")) return;

    const phrase = [...document.querySelectorAll("ol.words li")]
      .map((li) => li.textContent.trim())
      .join(" ");
    const note = document.getElementById("copy-note");

    try {
      // 127.0.0.1 counts as a secure context, so this is available.
      await navigator.clipboard.writeText(phrase);
      note.textContent = "Copied.";
    } catch {
      const scratch = document.createElement("textarea");
      scratch.value = phrase;
      document.body.appendChild(scratch);
      scratch.select();
      const ok = document.execCommand("copy");
      scratch.remove();
      note.textContent = ok ? "Copied." : "Could not copy — select the words instead.";
    }
  });
</script>
